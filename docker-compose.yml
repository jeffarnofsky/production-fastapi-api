services:
  db:
    image: postgres:16
    container_name: production_fastapi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: production_api
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: